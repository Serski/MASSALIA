name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # No REDIS_URL on purpose: the queue and the rate limiter stay in-memory.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/massalia_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The DB suites are gated on a *_test database and truncate it between tests.
      - name: Create test database
        run: psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE massalia_test"

      # The same command an agent runs before a push (scripts/gate.sh): build, lint,
      # migrate the test database, then the suites one package at a time.
      - name: Gate
        run: pnpm gate

      - name: Audit
        run: pnpm audit --audit-level=high
