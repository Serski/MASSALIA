# Nixpacks build plan (kept for local `nixpacks build` and any service that uses the
# Nixpacks builder). NOTE: the Railway services (server, worker) currently build
# with Railpack, which does not read this file — see docs/ARCHITECTURE.md → Backups.
[phases.setup]
# "..." keeps the Node provider's own packages (nodejs, pnpm). postgresql_18 adds
# pg_dump/pg_restore matching Railway's Postgres 18 for the nightly backup job; the
# archive is pinned to a nixos-25.11 commit that carries PostgreSQL 18.
nixPkgs = ["...", "postgresql_18"]
nixpkgsArchive = "b6018f87da91d19d0ab4cf979885689b469cdd41"

[phases.install]
cmds = ["corepack enable", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "pnpm railway:start"
