# Local Postgres + Redis for development and the DB-gated test suites.
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/massalia (see .env.example)
# Postgres 18 matches production; the CI runner uses postgres:16.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: massalia
    ports:
      - "5432:5432"
    volumes:
      - massalia-pg:/var/lib/postgresql
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  massalia-pg:
