<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Same-site first-party setup: scripts only from here + Plausible; API calls,
         SSE and portraits from api.playmassalia.com. Vite substitutes the API origin
         for non-production builds (see vite.config.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://plausible.io; connect-src 'self' https://api.playmassalia.com https://plausible.io; img-src 'self' data: https://api.playmassalia.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'"
    />
    <meta name="theme-color" content="#0b0706" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Massalia — The League</title>
    <meta name="description" content="Lead a Greek house in Massalia, 300 BC. Trade, scheme and hold office in a browser strategy RPG played one season a day." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Massalia" />
    <meta property="og:title" content="Massalia — The League" />
    <meta property="og:description" content="Lead a Greek house in Massalia, 300 BC. Trade, scheme and hold office in a browser strategy RPG played one season a day." />
    <meta property="og:url" content="https://playmassalia.com/" />
    <meta property="og:image" content="https://playmassalia.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Massalia — the city and harbour, with the lion medallion" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Privacy-friendly analytics by Plausible (queue stub lives in src/plausible.ts
         so the CSP needs no 'unsafe-inline' for scripts) -->
    <script async src="https://plausible.io/js/pa-tjvRliwlySzStk1TJJd6I.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
